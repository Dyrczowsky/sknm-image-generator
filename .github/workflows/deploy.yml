name: Deploy to Cloudflare

# Wdrożenie na https://sknm.dyrczowsky.win/ dopiero po przejściu wszystkich
# sprawdzeń. Uruchamiane po pushu na main (merge PR) oraz ręcznie /
# z claude-issue.yml (merge zrobiony GITHUB_TOKEN nie odpala workflowów push).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Sekrety środowiska: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
    # (wkompilowane w build, publiczne z założenia) i CLOUDFLARE_API_TOKEN.
    environment:
      name: github-pages
      url: https://sknm.dyrczowsky.win/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        # npm run build zawiera typecheck.
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy
        run: npx wrangler deploy --message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
