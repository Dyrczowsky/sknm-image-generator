name: CI

on:
  pull_request:
    branches: ["main"]
  # claude-issue.yml odpala CI ręcznie na swojej gałęzi: PR otwarty przez
  # GITHUB_TOKEN nie uruchamia zdarzenia pull_request, a check "check" jest
  # wymagany do merge na main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle Worker API
        # Wykrywa zepsuty bundle Workera już w PR (bez poświadczeń).
        run: npx wrangler deploy --dry-run --outdir api-dist -c api/wrangler.jsonc
